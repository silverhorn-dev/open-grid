services:
  open-grid:
    build:
      context: .
    restart: unless-stopped
    networks:
      - service_net
    # Alle Variablen kommen aus der `.env` neben dieser Datei (Vorlage: `.env.example`).
    environment:
      BUILD_VERSION: ${BUILD_VERSION:-self-hosted}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
      DATABASE_PATH: /app/data/open-grid.sqlite
      # TURN: Hostname + gemeinsames Secret mit dem coturn-Dienst unten.
      TURN_SERVER: ${TURN_SERVER:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_PORT: ${TURN_PORT:-3478}
      # Info-Seite auf eigener Subdomain (leer = unter /info) und Ziel von "Zur App" dort.
      INFO_HOST: ${INFO_HOST:-}
      APP_URL: ${APP_URL:-}
      # Web Push
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PORT: 3000
      # STUN: ohne Angabe dient der eigene TURN-Server als STUN. "none" = kein STUN.
      # STUN_SERVER: none
      # Club-/LAN-Betrieb ohne Internet (keine STUN/TURN-Server, HTTPS bleibt Pflicht).
      # LAN_MODE: "true"
      # App-Modi, die Nutzer waehlen koennen (discovery, chat, friends, event).
      # APP_MODES: discovery,chat,friends,event
      # Profil-Felder (JSON) fuer alle Modi; je Modus siehe PROFILE_SCHEMAS weiter unten. Leer = eingebautes.
      PROFILE_SCHEMA: ${PROFILE_SCHEMA:-}
      # DEFAULT_APP_MODE: discovery
      # Schluessel-Epoche fuer Alben und View-once-Snaps (Minuten). 5 = Testbetrieb.
      MEDIA_KEY_EPOCH_MINUTES: 5
      # Echter Betrieb: 3 Stunden
      # MEDIA_KEY_EPOCH_MINUTES: 180
      PROFILE_SCHEMAS: |
        {
          "discovery": [
            { "key": "displayName", "label": { "de": "Anzeigename", "en": "Display name" }, "type": "string", "required": true, "default": "Alex" },
            { "key": "age", "label": { "de": "Alter", "en": "Age" }, "type": "number", "min": 18, "max": 99, "default": 26 },
            { "key": "role", "label": { "de": "Position / Rolle", "en": "Position / Role" }, "type": "select", "options": ["Top", "Bottom", "Versatile", "Side"] },
            { "key": "bio", "label": { "de": "Über mich", "en": "About me" }, "type": "description" }
          ],
          "chat": [
            { "key": "displayName", "label": "Name", "type": "string", "required": true },
            { "key": "status", "label": { "de": "Status", "en": "Status" }, "type": "string" },
            { "key": "bio", "label": { "de": "Über mich", "en": "About me" }, "type": "description" }
          ],
          "event": [
            { "key": "displayName", "label": "Name", "type": "string", "required": true },
            { "key": "status", "label": { "de": "Status", "en": "Status" }, "type": "string" },
            { "key": "currentWorkshop", "label": { "de": "Aktueller Workshop", "en": "Current Workshop" }, "type": "string" },
            { "key": "bio", "label": { "de": "Über mich", "en": "About me" }, "type": "description" }
          ],
          "friends": [
            { "key": "displayName", "label": "Name", "type": "string", "required": true },
            { "key": "status", "label": { "de": "Status", "en": "Status" }, "type": "string" },
            { "key": "bio", "label": { "de": "Über mich", "en": "About me" }, "type": "description" }
          ]
        }
#    disabled b'cause we are in the service net
#    ports:
#      - "${OPEN_GRID_PORT:-3000}:3000"
    volumes:
      - open-grid-data:/app/data

  # TURN/STUN-Server (coturn). Startet nur mit dem Profil "turn",
  # z. B. `COMPOSE_PROFILES=turn` in der `.env` oder `docker compose --profile turn up -d`.
  # Host-Netzwerk, weil coturn viele UDP-Relay-Ports braucht.
  coturn:
    # Feste Version: neue Releases entfernen gelegentlich Optionen (4.18 kennt --no-dtls nicht mehr).
    image: coturn/coturn:4.18.0
    profiles:
      - turn
    network_mode: "host"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=${TURN_PORT:-3478}
      - --no-tls
      - --realm=${TURN_REALM:-${TURN_SERVER:-}}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --stale-nonce
      - --no-multicast-peers
    restart: unless-stopped

volumes:
  open-grid-data:
networks:
  service_net:
    external: true
