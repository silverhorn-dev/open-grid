name = "open-grid"
main = "worker.js"
compatibility_date = "2026-10-21"

[site]
bucket = "./"

[[rules]]
type = "Data"
globs = ["/*.json"]
fallbacks = []
fallthrough = true

[vars]
ENVIRONMENT = "production"

[version_metadata]
binding = "METADATA"

[[kv_namespaces]]
binding = "OPENGRID_KV"
id = "f073a35948b94dabb61449527d495c67"

[[durable_objects.bindings]]
name = "SIGNALING_HUB"
class_name = "SignalingHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingHub"]
