services:
  open-grid:
    build:
      context: .
    restart: unless-stopped
    networks:
      - service_net
    env_file:
      - turn/.env
    environment:
      BUILD_VERSION: ${BUILD_VERSION:-self-hosted}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
      DATABASE_PATH: /app/data/open-grid.sqlite
      # TURN-Server Konfiguration
      TURN_SERVER: turn.og.silverhorn.dev
      TURN_SECRET: ${TURN_SECRET:-}
      # Web Push
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PORT: 3000
    ports:
      - "${OPEN_GRID_PORT:-3000}:3000"
    volumes:
      - open-grid-data:/app/data

volumes:
  open-grid-data:
networks:
  service_net:
    external: true
